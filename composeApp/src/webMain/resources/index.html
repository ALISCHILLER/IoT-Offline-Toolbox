<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#176B5B" />
    <meta name="description" content="Offline-first IoT and local network diagnostics toolbox" />
    <title>IoT Offline Toolbox</title>
    <link rel="stylesheet" href="styles.css" />
    <script>
        const originalLanguages = Object.getOwnPropertyDescriptor(Navigator.prototype, "languages");
        if (originalLanguages && originalLanguages.get) {
            Object.defineProperty(Navigator.prototype, "languages", {
                configurable: true,
                get: function () {
                    return window.__customLocale
                        ? [window.__customLocale]
                        : originalLanguages.get.call(this);
                }
            });
        }
    </script>
</head>
<body>
<noscript>This application requires JavaScript or WebAssembly support.</noscript>
<script src="composeApp.js"></script>
</body>
</html>

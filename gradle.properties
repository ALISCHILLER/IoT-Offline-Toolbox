# ============================================================
# Kotlin
# ============================================================

kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

# ============================================================
# Gradle JVM / Performance
# ============================================================

org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8

org.gradle.configuration-cache=false
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.warning.mode=all

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# ============================================================
# Java / JDK Toolchains
# ============================================================

# Build contract:
# JDK 17 must be installed locally.
# Do not automatically download Java toolchains.
org.gradle.java.installations.auto-download=false

# Additional local JetBrains Runtime required by
# Compose Desktop Hot Reload.
#
# Required by:
# :composeApp:hotRunDesktop
#
# JBR 21 location:
org.gradle.java.installations.paths=C:\\Users\\Ali Soleimani\\.jdks\\jbr-21

# ============================================================
# Android
# ============================================================

android.useAndroidX=true
android.nonTransitiveRClass=true

# ============================================================
# Application Version
# ============================================================

# Release identity.
# Keep shared and iOS versions aligned.
# tools/static_audit.py enforces this.
appVersion=3.6.2
appVersionCode=38

# ============================================================
# Kotlin Native / iOS
# ============================================================

# iOS simulator tests are unavailable on Windows/Linux.
# macOS CI still executes them.
kotlin.native.ignoreDisabledTargets=true

version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      kotlin-and-compose:
        patterns:
          - "org.jetbrains.kotlin*"
          - "org.jetbrains.compose*"
      ktor:
        patterns:
          - "io.ktor*"
      androidx:
        patterns:
          - "androidx.*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
